server:
  port: 8085

spring:
  application:
    name: control-service
  datasource:
    url: jdbc:postgresql://localhost:5432/oddsmaker
    username: oddsmaker
    password: oddsmaker
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Oddsmaker配置
oddsmaker:
  admin:
    token: ${ADMIN_TOKEN:}
  # 公司配置
  company:
    id: ${COMPANY_ID:oddsmaker}
    name: ${COMPANY_NAME:Oddsmaker}

# Keycloak配置
keycloak:
  realm: ${KEYCLOAK_REALM:oddsmaker}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
  resource: ${KEYCLOAK_CLIENT_ID:control-service}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:}
  ssl-required: ${KEYCLOAK_SSL_REQUIRED:external}
  public-client: true
  bearer-only: true

# Spring Security OAuth2配置
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:oddsmaker}
  jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:oddsmaker}/protocol/openid-connect/certs

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    io.oddsmaker: INFO
    org.springframework.security: INFO
